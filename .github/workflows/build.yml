on:
  push:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    permissions:
      pages: write
      id-token: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: copy
        id: data
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.

      - name: deploy
        uses: actions/deploy-pages@v5

